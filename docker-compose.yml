version: "3.9"

services:
  # ── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memory-match-backend
    restart: unless-stopped
    environment:
      PORT: "4000"
      NODE_ENV: production
      DB_DIR: /app/data
      CORS_ORIGIN: "http://localhost:80"
    volumes:
      # Persist the SQLite database across container restarts
      - db_data:/app/data
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend (nginx) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memory-match-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
    driver: local
